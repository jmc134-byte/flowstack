name = "panel-lanzamientos"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Un solo cron cada minuto: el despachador decide qué toca (ver docs/FASE-0-PLAN.md §4.2).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "panel"
# ID de la base D1 de producción.
database_id = "f6869ac2-5e2f-4a42-8540-024e69a053c5"
migrations_dir = "migrations"

# Secretos (nunca en este archivo; se cargan con `wrangler secret put`):
#   GHL_WEBHOOK_SECRET                 secreto del header X-Panel-Secret de los workflows de GHL
#   STRIPE_WEBHOOK_SECRET_NORTHBOUND   whsec_ del webhook de la cuenta Northbound Studio

# App (PWA) compilada con Vite. El Worker atiende primero /api/*; el resto son archivos estáticos.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
OWNER_EMAIL = "jmc134@gmail.com"
